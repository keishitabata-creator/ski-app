.a-ex{background:var(--ex);color:var(--exInk)}.a-rb{background:var(--rb);color:var(--rbInk)}.a-rp{background:var(--rp);color:var(--rpInk)}.a-snow{background:var(--snow);color:var(--snowInk)}

/* 活動の行 */

document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion();});
const W='日月火水木金土', WK=['月','火','水','木','金','土','日'], SLOTS=['朝','昼','夜'];

function months(){const m=[];DAYS.forEach(d=>{const k=d.d.slice(0,7);if(fy(d.d)===year&&m.indexOf(k)<0)m.push(k);});return m;}
function grid(k,mini){const ds=DAYS.filter(d=>d.d.slice(0,7)===k);if(!ds.length)return '';const off=W.indexOf(ds[0].w);
  let h='<div class="wk" aria-hidden="true">'+W.split('').map(c=>'<span>'+c+'</span>').join('')+'</div><div class="cal">';
  for(let i=0;i<off;i++)h+='<div class="cell pad"></div>';
  let prev=null;
  ds.forEach(d=>{
    if(prev){let x=addD(prev,1);while(x<d.d){h+='<div class="cell pad miss" title="この日はデータがありません"></div>';x=addD(x,1);}}
    prev=d.d;
    const v=view(d),rows=rowsOf(d,v),dc=d.h?'sun':(d.sat?'sat':'');
    h+='<button class="cell '+cellCls(v)+(d.d===TODAY?' today':'')+(selMode?(SEL[d.d]?' picked':' pickable'):'')+'" data-day="'+d.d+'" aria-label="'+esc(md(d.d)+' '+v.school+' '+(v.nm||'')+' '+rows.map(r=>r.slot+kindLabel(r.kind,fhOf(r.act,r.fh))).join(' '))+'"><span class="cn '+dc+'">'+(+d.d.slice(8))+(()=>{const st=schState(d,v);return st?'<span class="sch '+st.c+'">'+(mini?st.l.slice(0,1):st.l)+'</span>':'';})()+'</span>'+(()=>{if(mini)return '';const L=(S.videos||[]).filter(x=>x.d===d.d&&!x.ref),nv=L.filter(x=>x.type!=='写真').length,np=L.length-nv;return (nv?'<span class="cvid">🎬'+nv+'</span>':'')+(np?'<span class="cvid">📷'+np+'</span>':'');})()+(CZ[d.d]?'<span class="czb'+(isAbs(v.school)?' two':'')+'">P</span>':'')+
      (!mini&&!v.kb&&v.off?'<span class="cl off">OFF</span>':'')+(!mini&&v.kb?'<span class="cl">'+(v.skip?'<span class="skipb">'+v.skipTxt+'</span>':'')+esc(shortEv(v)+(v.off?'／OFF':''))+'</span>':'')+
      '<span class="cks">'+(()=>{const g=[];rows.forEach(r=>{let x=g.find(y=>y.kind===r.kind);if(!x){x={kind:r.kind,fh:r.fh||'',n:0,done:0,ng:0};g.push(x);}x.n++;
          if(r.act&&r.act.st==='実施'&&S.sess[r.act.id]&&S.sess[r.act.id].fh)x.fh=S.sess[r.act.id].fh;if(r.act&&r.act.st==='実施'){x.done++;x.wj=(x.wj||0)+wjN(r.act);}if(r.act&&r.act.st==='やらなかった')x.ng++;});
        const lim=mini?3:4;return g.slice(0,lim).map(x=>'<i class="ck '+kCls(x.kind)+(x.done?' on':'')+(!x.done&&x.ng?' ng':'')+'">'+esc(x.fh?kAbbrFh(x.kind,x.fh):kAbbr(x.kind))+(x.wj?'<b>'+x.wj+'</b>':(x.n>1?'<b>'+x.n+'</b>':''))+'</i>').join('')+(g.length>lim?'<i class="ck more">…</i>':'');})()+'</span></button>';});
  return h+'</div>';}
function legend(){return '<div class="legend"><span><i class="c-race"></i>大会</span><span><i class="c-move"></i>移動・公式練習</span><span><i class="c-camp"></i>合宿・滞在</span><span><i class="c-off"></i>学校なし</span><span><i class="c-skip"></i>不参加</span><span><b class="sch">登校</b>授業</span><span><b class="sch sch-ex">考査</b>試験</span><span><b class="sch sch-ev">行事</b>行事・面談</span><span><b class="sch sch-sb">短縮</b>短縮・自宅</span><span><b class="sch sch-off">冬休み</b>休み・振休・祝日</span><span><b class="sch sch-ab">公欠</b>公欠・欠席</span><span><b class="sch sch-wk">ワ</b>ラーケーション</span><span><b class="sch sch-un">未定</b>学校の予定が未登録</span><span>P＝パーソナル</span><span>下の印：EX＝エクスプロッシブ　R＝ROMベーシック（Rフ＝フル、Rハ＝ハーフ）　R+＝ROMプラス　雪＝雪上。色つき＝実施、斜線＝やらなかった</span></div>';}
function ensureYear(){if(year===null){const t=DIDX[TODAY]!==undefined?TODAY:(TODAY<DAYS[0].d?DAYS[0].d:DAYS[DAYS.length-1].d);year=fy(t);month=t.slice(0,7);}}
function dayCard(d){const dc=d.h?'sun':(d.sat?'sat':''),v=view(d),m=schMark(v,d);
  return '<div class="day'+(d.d===TODAY?' today':'')+'"><button class="dhead" data-day="'+d.d+'"><span class="dn '+dc+'">'+md(d.d)+'（'+d.w+'）</span>'+
    (m?'<span class="sch '+((schState(d,v)||{}).c||'')+'">'+m+'</span>':'')+
    (CZ[d.d]?'<span class="sch sch-cz">パーソナル</span>':'')+(d.d===TODAY?'<span class="tlabel">今日</span>':'')+'<span class="chev">›</span></button>'+
    '<div class="bd">'+dayBody(d,{compact:true})+'</div></div>';}
function passFilter(d){const v=view(d);if(filt==='ev')return !!v.kb;if(filt==='abs')return isAbs(v.school);if(filt==='rec')return !!(S.acts[d.d]||[]).length;return true;}
function monthTitle(){return month==='all'?year+'年度（全体）':month.slice(0,4)+'年'+(+month.slice(5))+'月';}
function moveMonth(n){const ms=months();if(month==='all'){const ys=years(),i=ys.indexOf(year)+n;if(i<0||i>=ys.length)return;year=ys[i];month='all';return;}
  const all=[];years().forEach(y=>{const sv=year;year=y;months().forEach(k=>all.push([y,k]));year=sv;});
  const i=all.findIndex(x=>x[1]===month)+n;if(i<0||i>=all.length)return;year=all[i][0];month=all[i][1];}
function renderPlan(){
  ensureYear();const ms=months();if(month!=='all'&&ms.indexOf(month)<0)month=ms[0];
  let h='<div class="bar">';
  if(selMode){const n=Object.keys(SEL).length;
    h+='<div class="selhead"><b>'+n+'日を選択中</b><button class="linkbtn2" data-act="selEnd">やめる</button></div>'+
      '<div class="qrow"><button class="chip sm" data-act="selRange" aria-pressed="'+selRange+'">範囲で選ぶ</button><button class="chip sm" data-selp="wd">平日</button><button class="chip sm" data-selp="we">土日</button><button class="chip sm" data-selp="all">今月すべて</button><button class="chip sm" data-selp="none">選択を解除</button></div>'+
      '<p class="note" style="margin:6px 0 0">'+(selRange?'はじめの日と、おわりの日を押してください。':'日を押して選びます（もう一度押すと外れます）。長押しでも選択を始められます。')+'</p>';}
  else h+='<div class="navrow"><button class="nav" data-mv="-1" aria-label="前の月">‹</button><button class="mtitle" data-act="months">'+esc(monthTitle())+' ▾</button><button class="nav" data-mv="1" aria-label="次の月">›</button>'+
    '<button class="nav ic" data-mode="'+(mode==='cal'?'list':'cal')+'" aria-label="'+(mode==='cal'?'リスト表示':'カレンダー表示')+'">'+(mode==='cal'?'☰':'▦')+'</button>'+
    '<button class="nav ic" data-act="planMenu" aria-label="メニュー">⋯</button></div>'+
    (mode==='list'?'<div class="row" style="margin-top:6px">'+[['all','すべて'],['ev','大会・遠征'],['abs','公欠'],['rec','記録した日']].map(([k,l])=>'<button class="chip sm" data-filt="'+k+'" aria-pressed="'+(filt===k)+'">'+l+'</button>').join('')+'</div>':'');
  h+='</div><main>';
  if(!selMode&&canEdit()){const G=planGap();if(G.length>=5)h+='<div class="nudge plan" style="margin-top:8px"><span>'+md(G[0])+'から予定のない日が'+G.length+'日（2週間内）</span><button class="btn pri sm2" data-act="patOpen">型を当てはめる</button></div>';}
  if(!selMode){const y=month==='all'?year:fy(month+'-01'),sc=schoolCount(y),lim=Number(S.warkLimit)||5,left=lim-sc.used;
    h+='<div class="wkbar'+(left<0?' over':'')+'"><span class="sch sch-wk">ワ</span><b>ラーケーション 残り'+Math.max(0,left)+'回</b><span>／'+y+'年度 '+lim+'回</span>'+
      (sc.used?'<span>使った日：'+(sc.pre?'記録前 '+sc.pre+'回':'')+(sc.pre&&sc.wark.length?'／':'')+sc.wark.map(md).join('、')+'</span>':'<span>まだ使っていません</span>')+(left<0?'<span><b>上限を'+(-left)+'回超えています</b></span>':'')+
      (sc.miss.length?'<span class="sch sch-ab2">欠席</span><span>'+sc.miss.length+'日</span>':'')+'</div>';}
  if(mode==='cal'){
    if(month==='all')h+='<div class="mini">'+ms.map(k=>'<h2>'+k.slice(0,4)+'年'+(+k.slice(5))+'月</h2>'+grid(k,true)).join('')+'</div>'+legend();
    else{h+=grid(month,false)+legend();
      const mm=DAYS.filter(d=>d.d.slice(0,7)===month),ev=mm.filter(d=>{const v=view(d);return v.race&&(isRace(v)||v.skip);}),ab=mm.filter(d=>isAbs(view(d).school));
      const ev2=mm.filter(d=>{const m=markOf(d);return m&&['考査','行事','面談'].indexOf(m)>=0;});
      const off=mm.filter(d=>d.w!=='土'&&d.w!=='日'&&isOffDay(d));
      h+='<div class="keys"><h2>この月の平日の休み</h2>'+(off.length?'<div class="list">'+off.map(d=>{const st=schState(d)||{l:'休み',c:'sch-off'};return '<div><span class="sch '+st.c+'">'+st.l+'</span> '+mdw(d.d)+' '+esc(st.t||'')+'</div>';}).join('')+'</div>':'<p class="note">ありません。</p>')+
        '<h2>この月の試験・学校行事</h2>'+(ev2.length?'<div class="list">'+ev2.map(d=>'<div><span class="sch '+(MKC[markOf(d)]||'')+'">'+markOf(d)+'</span> '+mdw(d.d)+' '+esc(d.sy||d.sk)+'</div>').join('')+'</div>':'<p class="note">ありません。</p>')+
        '<h2>この月の大会</h2>'+(ev.length?'<div class="list">'+ev.map(d=>{const v=view(d);return '<div'+(v.skip?' class="skipline"':'')+'>'+mdw(d.d)+' '+(v.skip?'<span class="skipb">'+v.skipTxt+'</span> ':'')+esc(v.nm)+(S.results[v.race.id]?'<time>結果：'+esc(resTxt(S.results[v.race.id]))+'</time>':'')+'</div>';}).join('')+'</div>':'<p class="note">ありません。</p>')+
        '<h2>この月の公欠・欠席</h2>'+(ab.length?'<p class="note">'+ab.map(d=>md(d.d)).join('、')+'（'+ab.length+'日）</p>':'<p class="note">ありません。</p>')+'</div>';}
  } else {
    const list=DAYS.filter(d=>(month==='all'?fy(d.d)===year:d.d.slice(0,7)===month)&&passFilter(d));
    if(!list.length)h+='<p class="empty">この条件の日はありません。</p>';
    let last='';list.forEach(d=>{const k=d.d.slice(0,7);if(k!==last){h+='<h2>'+k.slice(0,4)+'年'+(+k.slice(5))+'月</h2>';last=k;}h+=dayCard(d);});
  }
  V.innerHTML=h+'</main>';
  const t=V.querySelector('.day.today');if(t&&!renderPlan.did){renderPlan.did=1;setTimeout(()=>t.scrollIntoView({block:'center'}),50);}
}
const tripState=id=>draftTrips?draftTrips.trips[id]:TRIPN[id].on;
const raceState=id=>draftTrips?draftTrips.races[id]:RACEN[id].on;
const per=t=>t.a&&t.b?md(t.a)+'〜'+md(t.b):'';
function retInfo(t){const rs=RACES.filter(r=>r.tr===t.id);if(!rs.length)return null;const last=rs.map(r=>r.d).sort().pop();
  const days=Object.keys(TD).filter(x=>TD[x].tr===t.id&&x>last&&has(TD[x].kb,'帰宅')).sort();
  if(days.length)return {txt:mdw(days[days.length-1])};
  const lt=TD[last];if(lt&&has(lt.etm,'帰宅'))return {txt:mdw(last)+'（大会当日）'};
  return {txt:'未登録',none:true};}
function vidUrl(v){return v.fileId?'https://drive.google.com/file/d/'+encodeURIComponent(v.fileId)+'/view':v.url;}
function vidItem(v){const nc=(S.vcoms||[]).filter(c=>c.vid===v.id).length;return '<div class="vid'+(v.best?' best':'')+'"><button class="vplay" data-vplay="'+esc(v.id)+'">'+(v.best?'☆ ':v.type==='写真'?'📷 ':'▶ ')+esc(v.title)+(v.want?' <small class="vw">コーチに見てほしい</small>':'')+(nc?' <small class="vw">💬'+nc+'</small>':'')+'</button><span>'+esc([md(v.d),v.slot,v.kind,v.memo,'登録：'+v.by].filter(Boolean).join('｜'))+'</span>'+(canEdit()?'<button class="linkbtn2 star" data-vstar="'+esc(v.id)+'" aria-pressed="'+!!v.best+'">'+(v.best?'☆を外す':'☆ベストにする')+'</button><button class="linkbtn2 danger" data-vdel="'+esc(v.id)+'">削除</button>':'')+'</div>';}
function renderRace(){
  const up=TRIPS.filter(t=>!t.b||t.b>=TODAY).sort((a,b)=>a.a<b.a?-1:1), past=TRIPS.filter(t=>t.b&&t.b<TODAY).sort((a,b)=>a.a<b.a?1:-1);
  let h='<main>';
  if(canEdit())h+='<div class="admbar"><button class="btn pri" data-act="addRace">＋ 大会を追加</button><button class="btn pri" data-act="addCamp">＋ 合宿を追加</button></div>';
  h+='<p class="note">'+(canEdit()?'行かない遠征・合宿や出ない大会は「不参加」「不出場」にして「変更を保存」を押してください。予定表には灰色で残ります。':'予定の変更は家族が行います。')+'大会が終わったら「結果を記録」から結果を残せます。</p>';
  const card=t=>{const on=tripState(t.id);const rs=RACES.filter(r=>r.tr===t.id);
    const sw=(attr,idv,onv,lab1,lab0,dis)=>canEdit()?'<button class="sw" role="switch" '+attr+'="'+esc(idv)+'" aria-checked="'+onv+'"'+(dis?' disabled':'')+'>'+(onv?lab1:lab0)+'</button>':'<span class="swl'+(onv?' on':'')+'">'+(onv?lab1:lab0)+'</span>';
    const ret=retInfo(t);
    let x='<div class="trip"><div class="trow"><div class="tt"><b>'+esc(t.name)+'</b><span>'+esc(per(t))+(t.a?'（'+t.a.slice(0,4)+'年）':'')+'</span>'+(ret?'<span class="resl'+(ret.none?' warn':'')+'">帰宅：'+esc(ret.txt)+'</span>':'')+'</div>'+sw('data-trip',t.id,on,'参加','不参加',false)+'</div>';
    if(rs.length){x+='<div class="races">';rs.forEach(r=>{const ro=raceState(r.id),res=S.results[r.id];
      x+='<div class="trow"><div class="tt"><b>'+esc(mdw(r.d)+' '+r.name)+'</b><span>'+esc([r.short,r.rank,r.ev].filter(Boolean).join('｜'))+'</span>'+(res?'<span class="resl">結果：'+esc(resTxt(res))+'</span>':'')+
        (on&&ro&&r.d<=TODAY?'<button class="linkbtn2" data-res="'+esc(r.id)+'">'+(res?'結果を直す':'🏁 結果を記録')+'</button>':'')+(()=>{const L=(S.videos||[]).filter(v=>v.race===r.id);return L.length?'<button class="linkbtn2" data-vplay="'+esc(L[0].id)+'" data-vlist="'+esc(L.map(v=>v.id).join(','))+'">📷 写真・動画 '+L.length+'</button>':'';})()+'</div>'+sw('data-race',r.id,on&&ro,'出場','不出場',!on)+'</div>';});x+='</div>';}
    if(canEdit())x+='<div class="admrow">'+(ret?'<button class="linkbtn2'+(ret.none?' hl':'')+'" data-tact="ret" data-id="'+esc(t.id)+'">'+(ret.none?'帰宅日を登録':'帰宅日を変更')+'</button>':'')+'<button class="linkbtn2" data-tact="shift" data-id="'+esc(t.id)+'">日程を変える</button><button class="linkbtn2" data-tact="rename" data-id="'+esc(t.id)+'">名前を変える</button><button class="linkbtn2 danger" data-tact="delete" data-id="'+esc(t.id)+'">削除</button></div>';
    return x+'</div>';};
  h+='<h2>これからの遠征・合宿</h2>'+(up.length?up.map(card).join(''):'<p class="note">登録されていません。</p>');
  const done=RACES.filter(r=>S.results[r.id]).sort((a,b)=>a.d<b.d?-1:1);
  if(done.length)h+='<h2>シーズンの成績</h2><div class="list">'+done.map(r=>'<div>'+mdw(r.d)+'　'+esc(r.short||r.name)+'<time>'+esc(resTxt(S.results[r.id]))+'</time>'+(S.results[r.id].memo?'<small class="memo">'+esc(S.results[r.id].memo)+'</small>':'')+'</div>').join('')+'</div>';
  if(past.length)h+='<details class="past"><summary>終わった遠征・合宿（'+past.length+'件）</summary>'+past.map(card).join('')+'</details>';
  V.innerHTML=h+'</main>';updSavebar();
}

// ---------- 活動の記録（メニュー式） ----------
function lastSess(kind,before,exceptId){const ks=Object.keys(S.acts).filter(x=>x<=before).sort().reverse();
  for(const x of ks){const L=(S.acts[x]||[]).filter(a=>a.kind===kind&&a.st==='実施'&&a.id!==exceptId&&S.sess[a.id]).sort((a,b)=>SLOTS.indexOf(b.slot)-SLOTS.indexOf(a.slot));if(L.length)return {d:x,a:L[0],s:S.sess[L[0].id]};}return null;}
function fillItems(kind,fh,date,exceptId){const M=menuOf(kind,fh),wj=M.length&&M.every(m=>m.unit==='本'),lp=lastSess(kind,date,exceptId);
  let base=M.map(m=>({name:m.name,v:wj?0:(m.v||''),unit:m.unit||'',sets:+m.sets||0,w:'',m}));
  if(wj){
    // 前回の本数を既定にし、最近よく使う技を上に並べる
    const use={};recentSess(kind,date,exceptId,6).forEach(s=>s.items.forEach(i=>{if((parseInt(i.v,10)||0)>0)use[i.name]=(use[i.name]||0)+1;}));
    if(lp)lp.s.items.forEach(i=>{const x=base.find(b=>b.name===i.name);if(x)x.v=parseInt(i.v,10)||0;else base.push({name:i.name,v:parseInt(i.v,10)||0,unit:'本',sets:0,w:'',m:null});});
    base=base.map((x,i)=>({x,i})).sort((p,q)=>((use[q.x.name]||0)-(use[p.x.name]||0))||(p.i-q.i)).map(p=>p.x);
    return {items:base,src:lp?'前回（'+mdw(lp.d)+'）の本数を入れています。よく使う技を上に並べています':'技ごとの本数を入れてください'};}
  if(lp&&(!fh||lp.s.fh===fh||!lp.s.fh)){lp.s.items.forEach(i=>{const x=base.find(b=>b.name===i.name);if(x){x.v=i.v;x.sets=+i.sets||0;x.w=i.w;}else base.push({name:i.name,v:i.v,unit:i.unit,sets:+i.sets||0,w:i.w,m:null});});
    return {items:base,src:'前回（'+mdw(lp.d)+'）と同じ内容を入れています'};}
  return {items:base,src:'メニューどおりの内容を入れています'};}
/** 最近の記録（新しい順・最大n件） */
function recentSess(kind,date,exceptId,n){const out=[];Object.keys(S.acts).sort().reverse().forEach(dd=>{if(dd>date)return;(S.acts[dd]||[]).forEach(a=>{if(a.kind===kind&&a.st==='実施'&&a.id!==exceptId&&S.sess[a.id])out.push(S.sess[a.id]);});});return out.slice(0,n);}
function openAct(date,slot,kind,id){
  const a=id?(S.acts[date]||[]).find(x=>x.id===id):null;if(a){slot=a.slot;kind=a.kind;}
  const menu=isMenu(kind),fhOn=hasFH(kind);
  act={date,id:a?a.id:'',slot,kind,st:a?a.st:'実施',memo:a?a.memo||'':'',sel:a&&!menu&&a.c?a.c.split('・'):[],fh:'',items:[],src:''};
  if(menu){const s=a&&S.sess[a.id];
    if(s){act.fh=s.fh||'';const M=menuOf(kind,s.fh||'');
      act.items=M.map(m=>{const i=s.items.find(x=>x.name===m.name);return i?{name:i.name,v:i.v,unit:i.unit||m.unit,sets:+i.sets||0,w:i.w,m}:{name:m.name,v:m.unit==='本'?0:m.v,unit:m.unit,sets:0,w:'',m};})
        .concat(s.items.filter(i=>!M.some(m=>m.name===i.name)).map(i=>({name:i.name,v:i.v,unit:i.unit,sets:+i.sets||0,w:i.w,m:null})));act.src='記録した内容です';}
    else{act.fh=fhOn?(plannedFh(date,slot,kind)||(lastSess(kind,date)||{s:{}}).s.fh||'フル'):'';const f=fillItems(kind,act.fh,date);act.items=f.items;act.src=f.src+(plannedFh(date,slot,kind)?'（予定は'+plannedFh(date,slot,kind)+'）':'');}}
  drawAct();openS('act');}
function readAct(){if(!act)return;act.memo=val('ac-memo');SH.querySelectorAll('[data-iv]').forEach(e=>{const x=act.items[+e.dataset.iv];if(x)x.v=e.value.trim();});SH.querySelectorAll('[data-iw]').forEach(e=>{const x=act.items[+e.dataset.iw];if(x)x.w=e.value.trim();});}
function drawAct(){const c=act,menu=isMenu(c.kind),wj=menu&&(MENUK[c.kind]||[]).every(m=>m.unit==='本');
  const other=(S.acts[c.date]||[]).filter(a=>a.id!==c.id);
  let h='<div class="grab"></div><div class="acthead '+kCls(c.kind)+'"><small>'+mdw(c.date)+'</small><b id="sh-title">'+c.slot+'　'+esc(c.kind)+(c.fh?'（'+esc(c.fh)+'）':'')+'</b></div>';
  if(other.length)h+='<p class="note">この日のほかの記録：'+other.map(a=>'<span class="atag sm '+kCls(a.kind)+'">'+a.slot+' '+esc(kindLabel(a.kind,fhOf(a,'')))+'</span>').join(' ')+'</p>';
  h+='<div class="lab">時間帯</div><div class="wrap">'+SLOTS.map(s=>'<button class="opt sm" data-aslot="'+s+'" aria-pressed="'+(c.slot===s)+'">'+s+'</button>').join('')+'</div>';
  h+='<div class="seg" role="group" style="margin-top:10px"><button data-ast="実施" aria-pressed="'+(c.st==='実施')+'">やった</button><button data-ast="やらなかった" aria-pressed="'+(c.st==='やらなかった')+'">やらなかった</button></div>';
  if(c.st==='実施'){
    if(menu){
      if(hasFH(c.kind))h+='<div class="seg" role="group" style="margin-top:8px">'+['フル','ハーフ'].map(x=>'<button data-afh="'+x+'" aria-pressed="'+(c.fh===x)+'">'+x+'</button>').join('')+'</div>';
      h+='<p class="note srcn">'+esc(c.src)+'。変わったところだけ直してください。</p>';
      if(wj)h+='<div class="qrow"><button class="btn sm2" data-act="wjPrev">前回と同じ本数</button><span class="note" id="wj-tot">合計 '+c.items.reduce((t,i)=>t+(parseInt(i.v,10)||0),0)+'本</span></div>';
      h+='<div class="mlist">'+c.items.map((x,i)=>{const m=x.m||{};
        if(wj)return '<div class="mi"><div class="mn"><b>'+esc(x.name)+'</b></div><div class="mc"><button class="stp" data-wst="-" data-i="'+i+'" aria-label="減らす">−</button><span class="sv"><b>'+(parseInt(x.v,10)||0)+'</b>本</span><button class="stp" data-wst="+" data-i="'+i+'" aria-label="増やす">＋</button></div></div>';
        const tgt=specOf(m);
        return '<div class="mi'+(x.sets?'':' zero')+'"><div class="mn"><b>'+esc(x.name)+'</b>'+(tgt?'<span class="tgt">目安：'+esc(tgt)+'</span>':'')+(m.how?'<span class="how">'+esc(m.how)+'</span>':'')+'</div>'+
          '<div class="mc">'+(x.unit&&x.unit!=='本'?'<label class="vbox"><input type="number" inputmode="numeric" min="0" data-iv="'+i+'" value="'+esc(x.v)+'"><span>'+esc(x.unit)+'</span></label>':'')+
          '<button class="stp" data-sst="-" data-i="'+i+'" aria-label="セットを減らす">−</button><span class="sv"><b>'+x.sets+'</b>セット</span><button class="stp" data-sst="+" data-i="'+i+'" aria-label="セットを増やす">＋</button>'+
          (m.wt||x.w?'<label class="vbox"><input type="number" inputmode="decimal" min="0" step="0.5" data-iw="'+i+'" value="'+esc(x.w)+'" placeholder="重さ"><span>kg</span></label>':'')+'</div></div>';}).join('')+'</div>';
      h+='<div class="qrow"><input type="text" id="ac-new" placeholder="種目を追加（メニューにないもの）" maxlength="50"><button class="btn sm2" data-act="aItem">追加</button></div>';
    } else {const tc=S.opt.tc[c.kind]||[];if(tc.length)h+='<div class="lab">やった内容（いくつでも）</div><div class="wrap">'+tc.map(t=>'<button class="opt sm" data-asel="'+esc(t)+'" aria-pressed="'+(c.sel.indexOf(t)>=0)+'">'+esc(t)+'</button>').join('')+'</div>';}
  }
  h+='<label class="lab" for="ac-memo">'+(c.st==='実施'?'メモ（気づき・コーチの指示など）':'やらなかった理由（なくてもよい）')+'</label><input type="text" id="ac-memo" maxlength="300" value="'+esc(c.memo)+'">';
  if(canEdit()&&menu&&!wj&&c.st==='実施')h+='<button class="linkbtn2" data-act="aAsStd">✎ この内容（回数・セット数）を標準値にする</button>';
  h+='<div class="acts">'+(c.id?'<button class="btn del" data-act="aDel">消す</button>':'')+'<button class="btn" data-act="aBack">戻る</button><button class="btn pri" data-act="aSave"'+(saving?' disabled':'')+'>'+(saving?'保存中…':'保存')+'</button></div>';
  SH.innerHTML=h;}
function actPayload(c){const menu=isMenu(c.kind);
  const p={date:c.date,id:c.id,slot:c.slot,kind:c.kind,st:c.st,memo:c.memo,c:!menu?c.sel.join('・'):''};
  if(menu&&c.st==='実施')p.sess={fh:c.fh,items:c.items.map(x=>({name:x.name,v:x.v,unit:x.unit,sets:x.sets,w:x.w}))};
  p.log=md(c.date)+' '+c.slot+' '+c.kind+'：'+(c.st==='やらなかった'?'やらなかった':(p.sess?(c.fh?c.fh+'／':'')+p.sess.items.filter(x=>x.sets||(x.unit==='本'&&+x.v)).map(x=>x.name+(x.unit==='本'?x.v+'本':(x.v?x.v+x.unit+'×':'')+x.sets+'セット'+(x.w?'・'+x.w+'kg':''))).join('、'):(p.c||'実施')))+(c.memo?'／'+c.memo:'');
  return p;}

function buildBrec(){const keep={},extra={};(brec.days||[]).forEach(x=>x.rows.forEach(r=>{keep[x.d+'|'+r.slot+'|'+r.kind]=r.st;if(r.add)(extra[x.d]=extra[x.d]||[]).push(r);}));
  const out=[];const ask=(S.askDays||[]).filter(x=>DIDX[x]!==undefined&&x<=TODAY);const seen={};
  const list=ask.slice().sort().reverse();for(let i=0;i<brec.span;i++){const x=addD(TODAY,-i);if(list.indexOf(x)<0)list.push(x);}
  list.forEach(x=>{if(DIDX[x]===undefined||seen[x])return;seen[x]=1;const d=DAYS[DIDX[x]];const asked=ask.indexOf(x)>=0;
    let rows=pendRows(d).map(r=>{const k=x+'|'+r.slot+'|'+r.kind;const old=(brec.days||[]).flatMap(y=>y.rows).find(y=>y.slot===r.slot&&y.kind===r.kind&&y.d===x);
      return {d:x,slot:r.slot,kind:r.kind,sug:r.sug||'',st:keep[k]!==undefined?keep[k]:'',fh:old&&old.fh||(hasFH(r.kind)?(r.fh||plannedFh(x,r.slot,r.kind)||((lastSess(r.kind,x)||{s:{}}).s.fh)||'フル'):'')};});
    (extra[x]||[]).forEach(r=>{if(!rows.some(y=>y.slot===r.slot&&y.kind===r.kind)&&!(S.acts[x]||[]).some(a=>a.slot===r.slot&&a.kind===r.kind))rows.push(r);});
    const done=(S.acts[x]||[]).length;if(!rows.length&&done)return;
    out.push({d:x,rows,done,trip:view(d).tripOn,asked,sug:rows.some(r=>r.sug)?rows.find(r=>r.sug).sug:''});});
  brec.days=out;}

function b64of(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('ファイルを読み込めませんでした'));r.readAsDataURL(blob);});}

function putDirect(loc,f,onp){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('PUT',loc,true);x.timeout=30*60*1000;
  x.upload.onprogress=e=>{if(e.lengthComputable)onp(e.loaded/e.total);};
  x.onload=()=>{if(x.status===200||x.status===201){try{const j=JSON.parse(x.responseText||'{}');if(j.id)return res(j.id);}catch(e){}}rej(new Error('direct '+x.status));};
  x.onerror=()=>rej(new Error('direct network'));x.ontimeout=()=>rej(new Error('direct timeout'));x.send(f);});}
async function putRelay(f,date,title,onp,st){const s0=await call('videoStart',{who,key,date,size:f.size,mime:f.type,name:date+'_'+title+(f.name.match(/\.[^.]+$/)||['.mp4'])[0]});

  while(pos<f.size){const end=Math.min(pos+CH,f.size);const b64=await b64of(f.slice(pos,end));
    let tries=0;for(;;){try{res=await call('videoChunk',{uid:s0.uid,start:pos,total:f.size,b64});break;}catch(e){if(++tries>=3)throw e;st('通信をやり直しています…');}}
    pos=end;onp(pos/f.size);}
  if(!res||!res.done)throw new Error('アップロードが完了しませんでした');return res.fileId;}

/** 原本を端末に読み込む（同じ画面の間はキャッシュ）。だめなら直接のURLを返す */
async function vBlob(v,onp,ac){const src=vSrc(v);if(!src)return '';if(vCache[v.fileId])return vCache[v.fileId];
  try{const r=await fetch(src,ac?{signal:ac.signal}:{});if(!r.ok)throw new Error('HTTP '+r.status);
    const total=+r.headers.get('content-length')||(v.mb?v.mb*1048576:0),rd=r.body&&r.body.getReader?r.body.getReader():null;let blob;
    if(rd){const parts=[];let got=0;for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;if(onp&&total)onp(got/total,got);}blob=new Blob(parts,{type:r.headers.get('content-type')||'video/mp4'});}
    else blob=await r.blob();const url=URL.createObjectURL(blob);vCache[v.fileId]=url;return url;}
  catch(e){if(e&&e.name==='AbortError')throw e;return src;}}
/** サムネイル（動画の1コマを小さなJPEGに）。失敗したら空 */
function makeThumb(url){return new Promise(res=>{const ve=document.createElement('video');let done=false;const fin=x=>{if(done)return;done=true;try{ve.removeAttribute('src');ve.load();}catch(e){}res(x||'');};
  setTimeout(()=>fin(''),4000);ve.muted=true;ve.playsInline=true;ve.preload='auto';ve.src=url;
  ve.addEventListener('loadeddata',()=>{try{ve.currentTime=Math.min(1,(ve.duration||2)/3);}catch(e){fin('');}},{once:true});
  ve.addEventListener('seeked',()=>{try{const w=240,h=Math.round(w*(ve.videoHeight||16)/(ve.videoWidth||9)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(ve,0,0,w,h);fin(c.toDataURL('image/jpeg',0.7).split(',')[1]);}catch(e){fin('');}},{once:true});
  ve.addEventListener('error',()=>fin(''),{once:true});});}
const thumbUrl=v=>v.thumb&&S.vkey?'https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(v.thumb)+'?alt=media&key='+encodeURIComponent(S.vkey):(v.fileId?'https://drive.google.com/thumbnail?id='+encodeURIComponent(v.fileId)+'&sz=w320':'');
/** 先に全部読み込んでから再生（止まらない・コマ送りが効く）。だめなら直接、さらにだめならドライブ */
async function loadVideo(v){const c=vplay,stage=document.getElementById('vp-stage'),ld=document.getElementById('vp-load'),src=vSrc(v);
  const mount=(url,note)=>{if(!vplay||vplay.id!==v.id)return;stage.innerHTML='<video id="vp-video" playsinline loop muted autoplay preload="auto" src="'+esc(url)+'"></video>'+(note?'<div class="vp-note">'+note+'</div>':'');
    const ve=document.getElementById('vp-video');ve.playbackRate=c.rate;ve.defaultPlaybackRate=c.rate;
    const seek=document.getElementById('vp-seek'),tm=document.getElementById('vp-time'),pp=document.getElementById('vp-pp');
    ve.addEventListener('timeupdate',()=>{if(ve.duration){seek.value=Math.round(ve.currentTime/ve.duration*1000);tm.textContent=ve.currentTime.toFixed(1)+'秒';}});
    ve.addEventListener('play',()=>{pp.textContent='❚❚';vpAutoHide();});ve.addEventListener('pause',()=>{pp.textContent='▶';vpShowUI();});
    seek.oninput=()=>{if(ve.duration){ve.pause();ve.currentTime=seek.value/1000*ve.duration;tm.textContent=ve.currentTime.toFixed(1)+'秒';}};
    ve.addEventListener('error',()=>{reportErr('動画再生','再生できません（コード '+(ve.error?ve.error.code:'?')+'）');stage.innerHTML='<iframe src="https://drive.google.com/file/d/'+esc(v.fileId)+'/preview" allow="autoplay"></iframe>';},{once:true});
    // 音は最初は消音（自動再生のため）。一度画面を触ったら音あり
    stage.addEventListener('touchend',()=>{ve.muted=false;},{once:true});};
  if(!v.fileId){stage.innerHTML='<div class="vp-load"><a href="'+esc(v.url)+'" target="_blank" rel="noopener">▶ リンク先で見る</a></div>';return;}
  if(!src){mount('');stage.innerHTML='<iframe src="https://drive.google.com/file/d/'+esc(v.fileId)+'/preview" allow="autoplay"></iframe>';return;}
  try{c.ac&&c.ac.abort();c.ac=new AbortController();const url=await vBlob(v,(r,got)=>{if(ld)ld.textContent='読み込み中 '+Math.min(99,Math.round(r*100))+'%（'+(got/1048576).toFixed(1)+'MB）';},c.ac);
    mount(url,url===src?'先読みできないため、読み込みながら再生しています':'');
    // サムネイルのない古い動画は、ここで作って付ける
    if(!v.thumb&&canEdit()&&/^blob:/.test(url)){makeThumb(url).then(b=>{if(!b)return;call('videoThumb',{who,key,id:v.id,thumb:b}).then(r=>{if(r&&r.thumb)v.thumb=r.thumb;}).catch(()=>{});});}}
  catch(e){if(e&&e.name==='AbortError')return;mount(src,'先読みできないため、読み込みながら再生しています');}}

  p.innerHTML=h;p.hidden=false;const ti=document.getElementById('vp-text');if(ti)ti.oninput=()=>{c.txt=ti.value;};const tk=document.getElementById('vp-task');if(tk)tk.onchange=()=>{c.task=tk.checked;};}

function vfActive(){return VF.per!=='all'||VF.kind||VF.best||VF.want||VF.com||VF.ref||VF.part||VF.q.trim()||VF.sort!=='new';}
function vFilter(){const t=TODAY,y=fy(t),pr={all:['0000','9999'],month:[t.slice(0,7)+'-01','9999'],prev:[addD(t.slice(0,7)+'-01',-1).slice(0,7)+'-01',addD(t.slice(0,7)+'-01',-1)],fy:[y+'-04-01',(y+1)+'-03-31']}[VF.per];const q=VF.q.trim();
  return (S.videos||[]).filter(v=>{if(VF.ref&&!v.ref)return false;if(v.d<pr[0]||v.d>pr[1])return false;if(VF.kind&&v.kind!==VF.kind)return false;if(VF.best&&!v.best)return false;if(VF.want&&!v.want)return false;
    const cs=vComs(v.id);if(VF.com&&!cs.length)return false;if(VF.part&&!cs.some(c=>c.part===VF.part)&&(v.tags||[]).indexOf(VF.part)<0)return false;

   .sort((a,b)=>(VF.sort==='new'?-1:1)*((a.d+a.at)<(b.d+b.at)?-1:(a.d+a.at)>(b.d+b.at)?1:0));}

function drwPaint(){const cv=document.getElementById('vd-c');if(!cv||!drw)return;const g=cv.getContext('2d'),W=cv.width,lw=Math.max(3,W/180);g.drawImage(drw.base,0,0);

// ---------- 使い方 ----------
function renderHelp(){
  V.innerHTML='<main class="help"><h2>使い方</h2>'+
  '<h3>1. はじめに：週の型を作る</h3><p>「予定」画面の「週の型で予定を作る」を押します。曜日×朝・昼・夜のマスを押して選び、下のボタンでやる活動を入れます（1つのマスに複数入れられます）。「平日にコピー」「土日にコピー」を使うと早く作れます。名前を付けて「保存して当てはめる」を押すと、選んだ期間の予定になります。試験・学校行事の日、遠征・合宿の日、手で変えた日は変わりません（チェックで外せます）。</p><p>型はいくつでも作れます（通常週、テスト週間、雪上シーズンなど）。期間ごとに当てはめ直してください。</p>'+
  '<h3>2. 毎日の記録</h3><p>ホームの「今日」に、その日の活動が時間帯ごとに並びます。</p><ul class="hl"><li><b>やった</b>：押すだけで記録します。ROM・エクスプロッシブは、前回と同じ内容（初回はメニューどおり）で記録されます</li><li><b>内容</b>：セット数・回数／秒数・重量を直して記録します。WJは技ごとの本数を入れます</li><li><b>やらなかった</b>：「内容」を開いて「やらなかった」を選び、理由を書いて保存します</li><li>予定にない活動をした日は「＋ 予定にない活動を記録」から</li><li>体調と備考は1日に1つ、「体調・備考を書く」から</li></ul><p><b>何日分かをまとめて記録するとき</b>は、ホームの知らせか「予定」画面の「まとめて記録」を押します。記録していない予定が日ごとに並びます。実際にやったものだけ押して「✓」にし（もう一度押すと「✕やらなかった」）、下のボタンを1回押せば記録できます。押さなかったものは記録されません。予定が入っていない日は、週の型の内容が「候補」として並びます。</p><p>ボタンを押すと、すぐに画面が変わります。保存は裏で行い、右上に「保存中…」→「✓ 保存しました」と出ます。</p><p>ROMプラスとエクスプロッシブのように、同じ時間帯に複数の活動がある日は、活動ごとに色の違う行で並びます。記録の画面の上には、どの活動を記録しているかが大きく出ます。</p><p>昨日の記録を忘れていると、ホームの上に知らせが出ます。</p>'+
  '<h3>カレンダーの見方</h3><p>日付の横の印で、その日の学校の状態が分かります。</p><ul class="hl"><li><b>青</b>：学校がある日（登校／短縮）</li><li><b>赤</b>：考査、<b>黄</b>：行事・面談</li><li><b>灰</b>：学校がない日（夏休み・冬休み・春休み・振休・祝日・自宅・休み）</li><li><b>桃</b>：公欠、<b>赤枠の桃</b>：欠席、<b>紫のワ</b>：ラーケーション</li><li><b>点線の未定</b>：学校の予定表がまだ登録されていない期間</li></ul><p>印の決まり方は2通りです。<b>公欠・欠席・ラーケーション・登校・非登校</b>は、日を押して「学校予定・メモを変更」→「学校の扱い」で選びます。<b>考査・行事・面談・短縮・自宅・夏休みなど</b>は、「学校予定」に書かれた言葉から自動で決まります（どの言葉がどの印になるかは、スプレッドシートの「選択肢」シートの「学校マーク」で変えられます）。</p><p>長期休業は、開始日と終了日から期間を自動で補っています。月のカレンダーの下に、その月の平日の休みと、試験・学校行事の一覧が出ます。公式練習の日には大会名も出ます。「P」はパーソナルの日です。</p>'+
  '<h3>スマホのホーム画面から開く</h3><p>iPhoneのSafariでこのアプリを開き、下の共有ボタン（□に↑）→「ホーム画面に追加」→「追加」。以後はホーム画面のアイコンを押すだけで開けます。Androidは Chrome のメニュー「ホーム画面に追加」です。ホーム画面から開いた初回だけ、記録者を選び直します。</p>'+
  '<h3>ラーケーション</h3><p>年度に'+(S.warkLimit||5)+'回まで取れる休みです（1日＝1回）。予定画面の上に残り回数が出ます。日を押して「学校予定・メモを変更」→「学校の扱い」で1日ずつ、または「複数日を選ぶ」→「学校の扱い」でまとめて設定できます。年度ごとの公欠・欠席・ラーケーションの日数は、実績画面の「年度」で確認できます。</p>'+
  
  '<h3>記録のしかた（v4.21）</h3><ul class="hl"><li>ROMの通算は「ROMをやった日」の数です。同じ日にROMベーシックとROMプラスをやっても1回（2件目は「同日2回目」と表示）</li><li>開いてすぐ押せます。電波が届かないときは端末に残り、つながったら自動で送ります（右上に「未送信 ○件」）</li><li>［やった］のあと6秒間は「取り消す」が出ます</li><li>✕を押すと「やらなかった」で記録。理由はあとから「理由を書く」で</li><li>WJは前回の本数が入り、よく使う技が上に並びます</li><li>ROMベーシックは予定でフル／ハーフを決められます（決めていなければ当日）。1タップの記録は予定の区分で入ります</li></ul>'+
  '<h3>実績を事実に合わせる（v4.22）</h3><ul class="hl"><li>カレンダーの「Rフ」「Rハ」は、記録前は予定の区分、記録後は実際にやった区分です</li><li>朝の予定を夜にやった場合も、同じ日・同じ活動なら予定の実施と数え、「（夜に実施）」と注記します</li><li>記録があるのに予定が空だった日は、日の画面の「記録どおりに予定を入れる」、または「⋯」→「記録どおりに予定を埋める」で、記録した活動を予定として入れられます（達成率・報告の「予定」が事実に合います）</li><li>過去の日の予定も「予定を変更」「複数日を選ぶ」「週の型（期間を指定）」で変えられます</li><li>記録のフル／ハーフをまとめて直すときは、「複数日を選ぶ」→日を選ぶ→「記録のフル／ハーフを直す」（種目・回数はその区分のメニューの標準値になります）</li></ul>'+
  '<h3>月次チェック（月末の締め）</h3><p>スプレッドシートのメニュー「行動予定アプリ」→「月次チェック」で、その月の点検表（1日1行）ができます。予定・実績・体調・問題（未記録／予定外／時間帯ちがい／区分ちがい／標準より少ない／明細なし）が並び、「どうする」の列に<b>おすすめが入っています</b>。違う日だけ▼で「そのまま／記録が正しい／予定が正しい／この日は休み／本人に聞く」から選び、メニュー「月次チェックの修正を反映」を押すだけです。</p><p>「本人に聞く」にした日は、本人のアプリのホームに知らせが出て、「まとめて記録」の先頭に「父から確認」として並びます。まとめて記録では、ROMベーシックの行に予定の区分（フル／ハーフ）が出て、✓にすると区分の切替と「内容を直して記録」（セット数を減らしたときなど）が使えます。セット数を個別に直すときは「月次チェック_○○_種目」シートに数を書きます。</p>'+
  '<h3>標準値（メニュー）をアプリで変える</h3><p>活動名を押して「今日のメニュー」→「標準値（回数・セット数）を変える」で、フル／ハーフそれぞれの回数・セット数を−／＋で直せます。記録画面でセット数を直したあと「この内容を標準値にする」を押しても同じです。変えた値は目安と初回の初期値になり、すでに記録した内容は変わりません。コーチは変えられません。</p>'+
  '<h3>学校・スポンサーへの報告PDF</h3><p>「実績」画面の一番下の「活動報告PDFを作る」。宛先（学校／スポンサー）と期間を選ぶだけです。PDFは「誰か（プロフィール）→今季の目標→ハイライト（ベスト成績・大会数・評定平均・部活）→文武両道→大会→遠征・合宿→日々のトレーニング→今後の予定→支援のお願い・連絡先」の順で、応援したくなる構成にしています。「設定」シートの「選手名」「所属」「学年・カテゴリー」「プロフィール」「今季の目標」「支援のお願い」「連絡先」を書いておくと載ります（setupで行が増えます）。学校向けは出欠の一覧と備考欄つき、支援のお願いは載りません。</p><h3>予定変更画面の見方</h3><p>ROMベーシックを選ぶと、その下に「└ ROMベーシックの区分：フル／ハーフ／当日決める」の段が出ます。どれかを選ぶまで保存できません（週の型・複数日も同じ）。「この日にパーソナルを受ける」で、未来の日にパーソナルを予定できます。</p>'+
  '<h3>動画（まとめて登録・☆・見比べ）</h3><p>動画の題名を押すと、読み込み（数秒）のあと全画面で撮影したままの画質で再生されます。くり返し再生、速さ（1倍・½・¼）、1コマ送り、下のつまみで位置を動かせます。操作は3秒で消え、画面を押すと出ます。左右にスワイプで前後の動画へ。「💬 ひとこと」は一時停止した場面の時刻つきで、「どこ」「どう」の言葉を押すだけで書けます（言葉は「選択肢」シートの「動画の言葉」で足せます）。コーチに見てほしい動画は「コーチに見てほしい」を押すと、コーチのホームに新着として出ます。動画の下の「ひとこと」はコーチ・本人・家族の全員が書けて、コーチのひとことは本人のホームに新着として出ます。登録のときは、写真を選ぶ画面の「オプション」で、位置情報オフ・フォーマット「現在のフォーマット」にしてください。日の画面の「＋ 動画を登録」で、一度に何本でも選べます（1日10本まで）。活動と時間帯を選ぶと、題名は「WJ 9/12 昼 ①」のように自動で付きます。活動の行に🎬の数が出て、押すと同じ活動の動画を新しい順に見比べられます。いちばん良い1本には「☆ベストにする」。☆の動画は実績画面に一覧で出ます。容量は実績画面の下に表示（ドライブ全体の使用量）。</p><h3>WJの本数</h3><p>記録画面に合計、カレンダーに「WJ42」、ホームに今週と今年度の本数、実績に期間の合計と今年度の累計が出ます。</p>'+
  '<h3>今日のひとこと（本人だけ）</h3><p>記録を押したあと、ホームに1問だけ出ます。かけらを押すか、ひとこと入れて「これでOK」。大会・パーソナル・合宿・学校行事・部活の公演・探究の日は2〜4問続きます。答えは「ことばのかけら」シートに貯まります。学期の問いが一通り終わると、ホームに「まとまったよ」と出て、自分の言葉でまとめた文章を読んで直せます（学校・スポンサーへの報告の先頭に載ります）。家族が「問い」シートで文面を直せます。</p>'+
  '<h3>部活（演劇部）と学業</h3><p><b>部活の入れ方</b>：予定は「予定を変更」（または週の型）で時間帯の「部活」ボタンを押す。参加の記録は、その日の行の［やった］か、日の画面の「部活（演劇部）に参加した」ボタン（1タップ・内容は練習）。公演・大会・合宿は［記録］で内容を選ぶ。カレンダーは「部」。コーチにも見えます。学業（学期・評定平均・順位・通知表の写真）は「実績」画面の一番下で父・母だけが登録・閲覧でき、本人・コーチには見えません。学校・スポンサー向けPDFには、全期間を通じた評定平均と学期ごとの評定平均が載ります。科目ごとの評定や試験ごとの学年順位は「学業明細」シートに貼り付けると、学期ごとの表と「学年順位の推移」で見られます。</p>'+

// ---------- 送信 ----------
function send(fn,p,after,okMsg){
  if(!FRESH){toast('最新のデータを確認しています。少し待ってからもう一度押してください');return;}
  if(!who){askWho();return;}
  if(S.needKey&&!key){pending={fn,p,after,okMsg};askKey();return;}
  p.who=who;p.key=key;p.ekey=ekey;p.partial=true;saving=true;const bs=SH.querySelectorAll('.acts .pri');bs.forEach(x=>{x.disabled=true;x.dataset.t=x.textContent;x.textContent='保存中…';});updSavebar();
  call(fn,p).then(d=>{applyPart(d);saving=false;if(after)after();render();if(sheetKind==='day'&&openDay){openDay=DAYS[DIDX[openDay.d]];drawDay();}
      toast(d.msg&&!okMsg?d.msg:(typeof okMsg==='function'?okMsg():okMsg)||d.msg||'保存しました');})
   .catch(e=>{saving=false;const m=errMsg(e);reportErr('保存：'+fn,m);bs.forEach(x=>{x.disabled=false;x.textContent=x.dataset.t||'保存';});
     if(m.indexOf('EKEY')>=0){ekey='';LS.set('ekey','');pending={fn,p,after,okMsg};askKey('plan');toast('予定を変えるための合言葉が違います');return;}
     if(m.indexOf('KEY')>=0){key='';LS.set('key','');pending={fn,p,after,okMsg};askKey();toast('合言葉が違います');return;}
     updSavebar();toast(/[^\x00-\x7F]/.test(m)&&m.length<300?m.replace(/^(Exception|Error):\s*/,''):'保存できませんでした。通信状態を確認して、もう一度保存してください。');});}
/** エラーを「エラー」シートに残す（失敗しても何もしない） */
let errN=0;
function reportErr(action,msg){try{if(errN++>20)return;if(/^(KEY|EKEY)$/.test(String(msg)))return;
  call('logError',{who:who||'',ver:CLIENT_VERSION,screen:tab+(sheetKind?'/'+sheetKind:''),action:String(action||'').slice(0,80),msg:String(msg||'').slice(0,500),ua:(navigator.userAgent||'').slice(0,120)}).catch(()=>{});}catch(e){}}
window.addEventListener('error',e=>reportErr('画面のエラー',(e&&e.message)||''));
window.addEventListener('unhandledrejection',e=>reportErr('画面のエラー（非同期）',(e&&e.reason&&e.reason.message)||String(e&&e.reason||'')));
function syncShow(msg){const e=document.getElementById('sync');if(!e)return;if(Q.length&&inflight===0){e.className='sync on';e.textContent='未送信 '+Q.length+'件（つながったら送ります）';return;}
  const idle=()=>{if(FRESH_AT){const t=new Date(FRESH_AT);e.className='sync info';e.textContent='最新 '+t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');}else{e.className='sync';e.textContent='';}};
  if(inflight>0){e.className='sync on';e.textContent=msg||(FRESH?'保存中…':'最新を確認中…');}
  else if(syncShow.saved){e.className='sync ok';e.textContent='✓ 保存しました';syncShow.saved=false;clearTimeout(syncShow.h);syncShow.h=setTimeout(idle,2500);}
  else idle();}
/** 画面を先に変え、保存は裏で行う（活動の記録用） */
function optimistic(list,del){list.forEach(p=>{const L=S.acts[p.date]=(S.acts[p.date]||[]).filter(a=>!(a.id&&a.id===p.id)&&!(a.slot===p.slot&&a.kind===p.kind));
    if(!del){const id=p.id||('tmp'+Date.now()+Math.random().toString(36).slice(2,6));L.push({id,slot:p.slot,kind:p.kind,st:p.st,c:p.c||'',memo:p.memo||'',by:who,at:''});if(p.sess)S.sess[id]={kind:p.kind,fh:p.sess.fh,items:p.sess.items.map(i=>({name:i.name,v:String(i.v),unit:i.unit,sets:String(i.sets),w:i.w}))};}
    if(!L.length)delete S.acts[p.date];});
  ingest(S);}
function redraw(){render();if(sheetKind==='day'&&openDay){openDay=DAYS[DIDX[openDay.d]];drawDay();}if(sheetKind==='brec'&&brec){buildBrec();drawBrec();}if(sheetKind==='pat'&&pat)drawPat();}
/** 通信の失敗か（＝あとで送れば通る）。サーバーが内容を拒否した場合は false */
const isNetErr=m=>/Load failed|Failed to fetch|NetworkError|通信エラー|timeout|タイムアウト|The Internet connection|network/i.test(String(m||''));
/* ---- 未送信の記録（端末に残し、つながったら送る） ---- */
let Q=[];try{Q=JSON.parse(localStorage.getItem('pendQ')||'[]')||[];}catch(e){Q=[];}
let qBusy=false;
function qSave(){try{localStorage.setItem('pendQ',JSON.stringify(Q));}catch(e){}}
function qKeys(e){return e.fn==='saveActivities'?e.p.list.map(x=>x.date+'|'+x.slot+'|'+x.kind):e.fn==='deleteActivity'?[e.p.date+'|'+e.p.slot+'|'+e.p.kind]:[e.p.date+'|'+e.p.slot+'|'+e.p.kind];}
/** 起動時：未送信の分を画面に反映しておく（前回データには入っていないため） */
function qReplay(){Q.forEach(e=>{try{if(e.fn==='deleteActivity'){if(e.delRow)optimistic([e.delRow],true);}else{const list=e.fn==='saveActivities'?e.p.list:[e.p];optimistic(list,false);}qKeys(e).forEach(k=>PENDK[k]=(PENDK[k]||0)+1);}catch(x){}});}
function qFlush(){if(qBusy||!Q.length||!navigator.onLine)return;qBusy=true;const e=Q[0];const p=Object.assign({},e.p,{who:e.who||who,key,ekey,partial:true});
  call(e.fn,p).then(d=>{Q.shift();qSave();qKeys(e).forEach(k=>{if(PENDK[k]&&--PENDK[k]<=0)delete PENDK[k];});applyPart(d);qBusy=false;syncShow();redraw();if(!Q.length)toast('未送信だった記録を送りました');else qFlush();})
   .catch(x=>{qBusy=false;const m=errMsg(x);if(!isNetErr(m)){Q.shift();qSave();qKeys(e).forEach(k=>{if(PENDK[k]&&--PENDK[k]<=0)delete PENDK[k];});reportErr('未送信の送信：'+e.fn,m);toast('送れなかった記録があります：'+m.replace(/^(Exception|Error):\s*/,''));load(true);}syncShow();});}
window.addEventListener('online',()=>setTimeout(qFlush,500));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(qFlush,800);});
setInterval(qFlush,30000);
/** 記録の保存：画面を先に変え、通信に失敗したら端末に残す（最新データを待たずに押せる） */
function sendRec(fn,p,okMsg,delRow,quiet){
  if(!who){askWho();return;}
  if(S.needKey&&!key){pending={fn,p,after:null,okMsg};askKey();return;}
  const list=fn==='saveActivities'?p.list:[p];const keys=list.map(x=>x.date+'|'+x.slot+'|'+x.kind);
  if(fn!=='deleteActivity'){optimistic(list,false);keys.forEach(k=>PENDK[k]=(PENDK[k]||0)+1);}else if(delRow)optimistic([delRow],true);
  redraw();inflight++;syncShow();
  p.who=who;p.key=key;p.ekey=ekey;p.partial=true;
  call(fn,p).then(d=>{keys.forEach(k=>{if(PENDK[k]&&--PENDK[k]<=0)delete PENDK[k];});inflight--;syncShow.saved=true;applyPart(d);redraw();syncShow();if(!quiet)toast((typeof okMsg==='function'?okMsg():okMsg)||'保存しました');})
   .catch(e=>{inflight--;const m=errMsg(e);reportErr('保存：'+fn,m);
     if(m.indexOf('KEY')>=0){keys.forEach(k=>{if(PENDK[k]&&--PENDK[k]<=0)delete PENDK[k];});key='';LS.set('key','');load(true);askKey();toast('合言葉が違います');syncShow();return;}
     if(isNetErr(m)){Q.push({fn,p:Object.assign({},p,{who:undefined,key:undefined,ekey:undefined}),who,delRow:delRow||null,ts:Date.now()});qSave();syncShow();toast('電波が届かないため、端末に残しました。つながったら自動で送ります');return;}
     keys.forEach(k=>{if(PENDK[k]&&--PENDK[k]<=0)delete PENDK[k];});syncShow();
     load(true);toast(/[^\x00-\x7F]/.test(m)&&m.length<300?'保存できませんでした：'+m.replace(/^(Exception|Error):\s*/,''):'保存できませんでした。通信状態を確認して、もう一度記録してください。');});}
/** 予定の変更：画面を先に変えて、保存は裏で行う */
function planLocal(dates,make,src){const m={};DAYS.forEach(d=>m[d.d]=d);
  dates.forEach(x=>{const d=m[x];if(!d)return;const res=make(d,parsePlan(d.plan),!!d.off);if(!res)return;const items=res.items||res;
    if(res.off!==undefined){d.off=!!res.off;const r0=S.days.find(y=>y[0]===x);if(r0)r0[10]=d.off?1:0;}
    d.plan=fmtPlan(items);d.src=src;
    const r=S.days.find(y=>y[0]===x);if(r){r[7]=d.plan;r[8]=d.src;}});
  ingest(S);}
/** 少しだけ変わる保存は、すべてこれを通す（画面を先に変えて、裏で保存） */
function sendPlan(fn,p,okMsg,local){
  if(!who){askWho();return;}
  if(!FRESH){toast('最新のデータを確認しています。少し待ってからもう一度押してください');return;}
  if(S.needKey&&!key){pending={fn,p,after:null,okMsg,plan:true};askKey();return;}
  if(S.needEKey&&!ekey){pending={fn,p,after:null,okMsg,plan:true};askKey('plan');return;}
  if(local)local();
  redraw();inflight++;syncShow();p.who=who;p.key=key;p.ekey=ekey;p.partial=true;
  call(fn,p).then(d=>{inflight--;syncShow.saved=true;applyPart(d);redraw();syncShow();toast(d.msg&&!okMsg?d.msg:(typeof okMsg==='function'?okMsg():okMsg)||d.msg||'保存しました');})
   .catch(e=>{inflight--;syncShow();const m=errMsg(e);reportErr('保存：'+fn,m);
     if(m.indexOf('EKEY')>=0){ekey='';LS.set('ekey','');load(true);askKey('plan');toast('予定を変えるための合言葉が違います');return;}
     if(m.indexOf('KEY')>=0){key='';LS.set('key','');load(true);askKey();toast('合言葉が違います');return;}
     load(true);toast(/[^\x00-\x7F]/.test(m)&&m.length<300?'保存できませんでした：'+m.replace(/^(Exception|Error):\s*/,''):'保存できませんでした。通信状態を確認して、もう一度お試しください。');});}

    call('videoComment',{who,key,vid:id,text,t:c.t,part:c.part,ev:c.ev,img}).then(d=>{applyPart(d);if(mkTask)call('saveTask',{who,key,vid:id,text:body}).then(r=>{S.tasks=r.tasks;toast('次の課題にしました');}).catch(e=>toast('課題にできませんでした：'+errMsg(e)));if(vplay&&vplay.id===id){vplay.part='';vplay.ev='';vplay.txt='';vplay.img='';vplay.task=false;drawPanel();const cb=document.querySelector('[data-act="vpCom"]');if(cb)cb.textContent='💬 ひとこと（'+vComs(id).length+'）';}toast('ひとことを送りました');}).catch(e=>{b.disabled=false;toast('送れませんでした：'+errMsg(e));});return;}
  if(ds.vwant){const v=(S.videos||[]).find(x=>x.id===ds.vwant);if(!v)return;const nw=!v.want;v.want=nw;if(vplay)vpMenu();else render();
    call('videoUpdate',{who,key,id:v.id,want:nw}).then(d=>{applyPart(d);if(vplay)vpMenu();else render();toast(nw?'コーチに見てほしい動画にしました':'外しました');}).catch(e=>{v.want=!nw;if(vplay)drawPlayer();toast('変更できませんでした：'+errMsg(e));});return;}
  if(ds.vstar){const v=(S.videos||[]).find(x=>x.id===ds.vstar);if(!v)return;const nb=!v.best;v.best=nb;if(vplay)vpMenu();else render();if(SH&&SH.querySelector('[data-vstar="'+v.id+'"]')){const bt=SH.querySelector('[data-vstar="'+v.id+'"]');bt.textContent=nb?'☆を外す':'☆ベストにする';bt.setAttribute('aria-pressed',nb);}
    call('videoUpdate',{who,key,id:v.id,best:nb}).then(d=>{applyPart(d);if(vplay)vpMenu();else render();toast(nb?'☆ベストの1本にしました':'☆を外しました');}).catch(e=>{v.best=!nb;render();toast('変更できませんでした：'+errMsg(e));});return;}
  if(ds.act==='vidGo'){uploadVid();return;}
  if(ds.act==='vidBack'){if(upBusy)return;const x=sheetCtx&&sheetCtx.date;closeSheet();if(x)openDaySheet(x);return;}
  if(ds.vdel){if(!confirm('削除しますか？\n（アプリからは消えますが、アーカイブとして残り、あとで戻せます）'))return;const vid=ds.vdel;
    call('videoDelete',{who,key,id:vid}).then(d=>{applyPart(d);if(vplay&&vplay.id===vid)closePlayer();else render();toast('削除しました（アーカイブに残っています）');}).catch(e=>toast('削除できませんでした：'+errMsg(e)));return;}
  if(ds.trip){ensureDraft();draftTrips.trips[ds.trip]=!draftTrips.trips[ds.trip];renderRace();return;}
  if(ds.race){ensureDraft();draftTrips.races[ds.race]=!draftTrips.races[ds.race];renderRace();return;}
  if(b.id==='selgo'){openSelDays();return;}
  if(b.id==='savetrips'){const diff=draftDiff();if(!diff.length||saving)return;send('saveParticipation',{changes:diff},()=>{draftTrips=null;},null);return;}
});
function pickDay(x){
  if(selRange){ if(!selAnchor){selAnchor=x;SEL[x]=1;}
    else{const a=selAnchor<x?selAnchor:x,b=selAnchor<x?x:selAnchor;DAYS.forEach(d=>{if(d.d>=a&&d.d<=b)SEL[d.d]=1;});selAnchor='';}}
  else{ if(SEL[x])delete SEL[x];else SEL[x]=1;}
  render();}
document.addEventListener('pointerdown',e=>{const c=e.target.closest('[data-day]');
  if(!c||tab!=='plan'||mode!=='cal'||!canEdit())return;const x=c.dataset.day;
  clearTimeout(pressT);pressT=setTimeout(()=>{noClick=true;if(!selMode){selMode=true;SEL={};selRange=false;selAnchor='';}
    pickDay(x);if(navigator.vibrate)navigator.vibrate(15);toast('複数日を選んでいます');},450);});
['pointerup','pointercancel','pointermove','scroll'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(pressT),{passive:true}));
// 予定のカレンダーは、左右になぞって月を変えられる
let swX=0,swY=0,swOn=false;
document.addEventListener('touchstart',e=>{if(tab!=='plan'||mode!=='cal'||sheetKind||e.touches.length!==1){swOn=false;return;}swOn=true;swX=e.touches[0].clientX;swY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(!swOn)return;swOn=false;const t2=e.changedTouches[0];const dx=t2.clientX-swX,dy=t2.clientY-swY;
  if(Math.abs(dx)>70&&Math.abs(dy)<50&&!selMode){moveMonth(dx<0?1:-1);render();window.scrollTo(0,0);}},{passive:true});
document.addEventListener('change',e=>{const id=e.target.id||'';
  if(sheetKind==='pat'&&/^p-(a|b|ow|prot)$/.test(id)){readPat();drawPat();}
  if(sheetKind==='bulk'&&/^b-/.test(id)){readBulk();drawBulk();}
  if(sheetKind==='trip'&&/^s-(a|b)$/.test(id)){const a=val('s-a'),b=val('s-b'),t=TRIPN[sheetCtx.id],e=document.getElementById('s-pv');
    if(e&&a&&b&&t){const n=Math.round((pdate(b)-pdate(a))/86400000)+1,old=Math.round((pdate(t.b)-pdate(t.a))/86400000)+1,dd=Math.round((pdate(a)-pdate(t.a))/86400000);
      e.className='note pvw';e.textContent=md(t.a)+'〜'+md(t.b)+'（'+old+'日間）→ '+md(a)+'〜'+md(b)+'（'+n+'日間）'+(dd?'　'+(dd>0?dd+'日後ろへ':(-dd)+'日前へ'):'')+(n!==old?'　'+(n>old?(n-old)+'日のばす':(old-n)+'日みじかく'):'');}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetKind&&sheetKind!=='who'&&!saving)closeSheet();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S&&!sheetKind&&!saving&&!draftDiff().length)load(true);});
window.addEventListener('focus',()=>{if(!draftDiff().length)refreshIfStale(60000);});
if(/^#r=/.test(location.hash)&&(API_URL||INSIDE_GAS))extMain(location.hash.slice(3));else if(inAppGuide()){}else if(INSIDE_GAS||API_URL)load(false);
else V.innerHTML='<main><p class="empty">このページは、デプロイしたウェブアプリのURLから開くか、通信先（API_URL）を設定してください。</p></main>';
document.addEventListener('input',e=>{if(e.target&&e.target.id==='q-text'){const card=e.target.closest('.qcard');const btn=card&&card.querySelector('[data-act="qOk"]');if(btn)btn.disabled=!(e.target.value.trim()||((qsel[card.dataset.qid]||[]).length));}});

})();
